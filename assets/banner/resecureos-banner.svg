  <text x="272" y="168" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#ccfbf1" letter-spacing="2">RECOVER &#183; ACQUIRE &#183; VERIFY &#183; RESECURE</text>
