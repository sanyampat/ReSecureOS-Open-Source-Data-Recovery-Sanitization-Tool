    <line x1="0" y1="130" x2="1200" y2="130"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="200" y1="0" x2="200" y2="260"/>
    <line x1="500" y1="0" x2="500" y2="260"/>
    <line x1="850" y1="0" x2="850" y2="260"/>
  </g>

  <!-- Shield mark -->
  <g transform="translate(90,50)">
    <path d="M80 8
             L138 30
             V78
             C138 116 114 144 80 154
             C46 144 22 116 22 78
             V30
             Z"
